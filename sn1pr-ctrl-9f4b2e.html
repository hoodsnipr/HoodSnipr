<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>·</title>
<style>
:root{--void:#0C0E10;--panel:#141920;--panel2:#1B222B;--line:#222A31;--text:#E8EEF2;--mute:#7C8683;
  --green:#00C805;--green-dim:rgba(0,200,5,.12);--red:#FF4D4D;--gold:#FFD166;
  --mono:ui-monospace,Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
  padding:24px 16px calc(40px + env(safe-area-inset-bottom));line-height:1.6}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:15px;font-family:var(--mono);letter-spacing:.16em;color:var(--green);margin-bottom:4px}
.sub{font-family:var(--mono);font-size:11px;color:var(--mute);margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mute);margin-bottom:6px}
input,textarea{width:100%;background:var(--void);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:11px 12px;font-family:var(--mono);font-size:13px;margin-bottom:12px}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
button{width:100%;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;
  font-family:var(--mono);letter-spacing:.06em;min-height:46px}
.primary{background:var(--red);color:#000}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.ok{background:var(--green);color:#000}
.row{display:flex;gap:8px}
.who{font-family:var(--mono);font-size:11px;padding:9px 11px;border-radius:9px;background:var(--panel2);
  color:var(--mute);margin-bottom:12px;word-break:break-all}
.who b{color:var(--green)}
.who.bad b{color:var(--red)}
.msg{font-family:var(--mono);font-size:11px;padding:11px;border-radius:9px;margin-top:10px;display:none;white-space:pre-wrap;word-break:break-word}
.msg.show{display:block}
.msg.good{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.msg.err{background:rgba(255,77,77,.1);color:var(--red);border:1px solid var(--red)}
.list{margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px}
.item .a{color:var(--text);word-break:break-all}
.item .m{color:var(--mute);font-size:10px}
.item button{width:auto;padding:6px 11px;font-size:10px;min-height:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>◎ SN1PR CTRL</h1>
  <div class="sub">token ban console · signature required</div>

  <div class="card">
    <div class="who" id="who">Wallet not connected</div>
    <button class="ghost" id="connect">CONNECT WALLET</button>
  </div>

  <div class="card">
    <label>TOKEN CONTRACT ADDRESS</label>
    <input id="token" placeholder="0x…" autocomplete="off" spellcheck="false">
    <label>SYMBOL (optional, for the log)</label>
    <input id="sym" placeholder="SCAM" autocomplete="off">
    <label>REASON (optional)</label>
    <input id="reason" placeholder="force-send exploit" autocomplete="off">
    <div class="row">
      <button class="primary" id="ban">BAN TOKEN</button>
      <button class="ghost" id="unban">UNBAN</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <label>CURRENT BANS</label>
    <div class="list" id="list"><div class="item"><span class="m">loading…</span></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script>
(function(){
  var API="/.netlify/functions";
  var $=function(s){return document.querySelector(s)};
  var signer=null, addr=null;

  function say(t, bad){
    var m=$("#msg");
    m.textContent=t;
    m.className="msg show "+(bad?"err":"good");
  }
  function msgFor(action, token, ts){
    return ["HoodSnipr admin action","action: "+action,"token: "+token.toLowerCase(),"timestamp: "+ts].join("\n");
  }

  $("#connect").addEventListener("click", async function(){
    if(!window.ethereum){ say("No wallet found in this browser.", true); return; }
    try{
      var prov=new ethers.BrowserProvider(window.ethereum);
      await prov.send("eth_requestAccounts",[]);
      signer=await prov.getSigner();
      addr=await signer.getAddress();
      $("#who").innerHTML='Signing as <b>'+addr+'</b>';
      $("#who").className="who";
      loadBans();
    }catch(e){ say(e.message||"Connect failed", true); }
  });

  async function submit(action){
    if(!signer){ say("Connect the owner wallet first.", true); return; }
    var token=($("#token").value||"").trim().toLowerCase();
    if(!/^0x[0-9a-f]{40}$/.test(token)){ say("Enter a valid contract address.", true); return; }
    var ts=Date.now();
    try{
      var sig=await signer.signMessage(msgFor(action, token, ts));
      var r=await fetch(API+"/banlist",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({ action:action, token:token, ts:ts, signature:sig,
          sym:($("#sym").value||"").trim(), reason:($("#reason").value||"").trim() })});
      var j=await r.json();
      if(!r.ok){ say((j.error||"rejected")+(j.signer?("\nrecovered: "+j.signer):""), true); return; }
      say(action==="ban" ? ("Banned "+token+"\nIt is off the board immediately.")
                         : ("Unbanned "+token));
      $("#token").value=""; $("#sym").value=""; $("#reason").value="";
      loadBans();
    }catch(e){ say(e.shortMessage||e.message||"Failed", true); }
  }
  $("#ban").addEventListener("click", function(){ submit("ban"); });
  $("#unban").addEventListener("click", function(){ submit("unban"); });

  async function loadBans(){
    try{
      var r=await fetch(API+"/banlist");
      var j=await r.json();
      var el=$("#list");
      if(!j.bans || !j.bans.length){ el.innerHTML='<div class="item"><span class="m">No tokens banned.</span></div>'; return; }
      el.innerHTML=j.bans.map(function(b){
        return '<div class="item"><div><div class="a">'+(b.sym?("$"+b.sym+" · "):"")+b.token+'</div>'
          +'<div class="m">'+new Date(b.at).toLocaleString()+(b.reason?" · "+b.reason:"")+'</div></div>'
          +'<button class="ghost" data-un="'+b.token+'">UNBAN</button></div>';
      }).join("");
      el.querySelectorAll("[data-un]").forEach(function(btn){
        btn.addEventListener("click", function(){ $("#token").value=btn.getAttribute("data-un"); submit("unban"); });
      });
    }catch(e){ $("#list").innerHTML='<div class="item"><span class="m">Could not load.</span></div>'; }
  }
  loadBans();
})();
</script>
</body>
</html>
