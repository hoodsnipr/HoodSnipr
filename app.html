// ---- seeded rng so sparklines are stable per token ----
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeSpark(seed, n = 28, drift = 0) {
  const rnd = mulberry32(seed);
  let v = 50;
  const pts = [];
  for (let i = 0; i < n; i++) {
    v += (rnd() - 0.48 + drift) * 9;
    v = Math.max(6, Math.min(94, v));
    pts.push(v);
  }
  return pts;
}

      <line x1="30" y1="20" x2="40" y2="20" stroke={color} strokeWidth="3" />
    </svg>
  );
}

/* ---------- Sparkline ---------- */
function Spark({ pts, up }) {
  const w = 96, h = 34;
  const path = pts
    .map((v, i) => `${i === 0 ? "M" : "L"}${((i / (pts.length - 1)) * w).toFixed(1)},${(h - (v / 100) * h).toFixed(1)}`)
    .join(" ");
  const col = up ? C.green : C.red;
  return (
    <svg width={w} height={h} style={{ display: "block" }} aria-hidden="true">
      <path d={path} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <circle
        cx={w}
        cy={h - (pts[pts.length - 1] / 100) * h}
        r="2.6"
        fill={col}
      />
    </svg>
  );
}

            {snipes.length === 0 ? (
              <div style={{
                background: C.panel, border: `1px dashed ${C.line}`, borderRadius: 16,
                padding: "44px 20px", textAlign: "center",
              }}>
                <Scope size={38} color={C.muted} />
                <p style={{ color: C.muted, marginTop: 12, fontSize: 14 }}>
                  No snipes yet. Pick a token from Trending and take the shot.
                </p>
              </div>
            ) : (
              <>
                <div style={{
                  display: "flex", gap: 14, marginBottom: 12, fontFamily: "'DM Mono', monospace", fontSize: 12,
                }}>
                  <span style={{ color: C.muted }}>TOTAL: <span style={{ color: C.text }}>{totalVol.toFixed(4)} ETH</span></span>
                  <span style={{ color: C.muted }}>FEES PAID: <span style={{ color: C.green }}>{totalFees.toFixed(5)} ETH</span></span>
                </div>
                <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
                  {snipes.map((s, i) => (
                    <div key={i} style={{
                      display: "flex", justifyContent: "space-between", alignItems: "center",
                      padding: "12px 16px", borderBottom: i < snipes.length - 1 ? `1px solid ${C.line}` : "none",
                    }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>🎯 ${s.sym}</div>
                        <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: C.muted }}>
                          {s.time} · {s.mode === "wallet" ? "wallet" : "sent ETH"}
                        </div>
                      </div>
                      <div style={{ textAlign: "right", fontFamily: "'DM Mono', monospace" }}>
                        <div style={{ fontSize: 13, color: C.green }}>
                          +{s.out.toLocaleString(undefined, { maximumFractionDigits: 0 })}
                        </div>
                        <div style={{ fontSize: 11, color: C.muted }}>-{s.ethIn} ETH</div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        )}
      </main>

      {/* ---------- snipe modal ---------- */}
      {snipeToken && (
        <div onClick={() => !firing && setSnipeToken(null)} style={{
          position: "fixed", inset: 0, background: "#000A", backdropFilter: "blur(4px)",
          display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50,
        }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: C.panel2, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 480,
            padding: "22px 20px 30px", border: `1px solid ${C.line}`, borderBottom: "none",
            animation: "pop .22s ease-out",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Scope size={22} />
                <div>
                  <div style={{ fontWeight: 700, fontSize: 17 }}>Snipe ${snipeToken.sym}</div>
                  <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: C.muted }}>
                    ${fmtPrice(snipeToken.livePrice)} · {snipeToken.chg[tf] >= 0 ? "+" : ""}{snipeToken.chg[tf].toFixed(1)}% {tf}
                  </div>
                </div>
              </div>
              <button onClick={() => setSnipeToken(null)} style={{ background: "transparent", color: C.muted, fontSize: 20 }}>✕</button>
            </div>

            {/* pay mode toggle */}
            <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
              {[["wallet", "🔗 Wallet"], ["send", "📤 Send ETH"]].map(([k, label]) => (
                <button key={k} onClick={() => setPayMode(k)} style={{
                  flex: 1, padding: "10px 0", borderRadius: 10, fontWeight: 700, fontSize: 13,
                  background: payMode === k ? C.greenDim : C.bg,
                  color: payMode === k ? C.green : C.muted,
                  border: `1px solid ${payMode === k ? C.green : C.line}`,
                }}>{label}</button>
              ))}
            </div>

            {payMode === "wallet" ? (
              <>
                <label style={{ display: "block", fontFamily: "'DM Mono', monospace", fontSize: 11, color: C.muted, marginTop: 16, letterSpacing: ".08em" }}>
                  AMOUNT (ETH)
                </label>
                <input value={ethIn} onChange={(e) => setEthIn(e.target.value.replace(/[^0-9.]/g, ""))} inputMode="decimal" style={{
                  width: "100%", marginTop: 6, background: C.bg, border: `1px solid ${C.line}`,
                  borderRadius: 12, color: C.text, fontSize: 22, padding: "13px 14px", outline: "none",
                }} />
                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  {["0.05", "0.1", "0.25", "0.5", "1"].map((v) => (
                    <button key={v} onClick={() => setEthIn(v)} style={{
                      flex: 1, padding: "6px 0", background: C.bg, border: `1px solid ${C.line}`,
                      borderRadius: 8, color: C.muted, fontFamily: "'DM Mono', monospace", fontSize: 12,
                    }}>{v}</button>
                  ))}
                </div>
              </>
            ) : (
              <div style={{ marginTop: 16, background: C.bg, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
                <div style={{ fontFamily: "'DM Mono', monospace", fontSize: 11, color: C.muted, letterSpacing: ".08em" }}>
                  SEND ETH ON ROBINHOOD CHAIN TO
                </div>
                <div style={{
                  fontFamily: "'DM Mono', monospace", fontSize: 14, color: C.green, marginTop: 6,
                  wordBreak: "break-all", padding: "8px 10px", background: C.panel, borderRadius: 8,
                }}>
                  {DEPOSIT_ADDR}
                </div>
                <p style={{ fontSize: 12, color: C.muted, marginTop: 10, lineHeight: 1.5 }}>
                  Include token symbol <span style={{ color: C.text, fontFamily: "'DM Mono', monospace" }}>${snipeToken.sym}</span> in
                  calldata (production: unique deposit address per snipe). Tokens are delivered back to the sending address.
                  Still enter your amount below for the fee preview.
                </p>
                <input value={ethIn} onChange={(e) => setEthIn(e.target.value.replace(/[^0-9.]/g, ""))} inputMode="decimal" style={{
                  width: "100%", marginTop: 8, background: C.panel, border: `1px solid ${C.line}`,
                  borderRadius: 10, color: C.text, fontSize: 18, padding: "10px 12px", outline: "none",
                }} />
              </div>
            )}

            {/* fee breakdown */}
            <div style={{
              marginTop: 14, background: C.bg, borderRadius: 12, padding: "12px 14px",
              fontFamily: "'DM Mono', monospace", fontSize: 12,
            }}>
              {[
                ["Snipe fee (0.25%)", feeEth.toFixed(6) + " ETH", C.muted],
                ["Net swapped", netEth.toFixed(6) + " ETH", C.text],
                ["Est. received", "≈ " + estOut.toLocaleString(undefined, { maximumFractionDigits: 0 }) + " $" + snipeToken.sym, C.green],
              ].map(([k, v, col]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}>
                  <span style={{ color: C.muted }}>{k}</span>
                  <span style={{ color: col }}>{v}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0" }}>
                <span style={{ color: C.muted }}>Fee wallet</span>
                <span style={{ color: C.muted }}>{FEE_WALLET} 🔒</span>
              </div>
            </div>

            <button onClick={fireSnipe} disabled={firing} style={{
              width: "100%", marginTop: 16, background: firing ? C.panel : C.green, color: "#000",
              fontWeight: 700, fontSize: 16, padding: "15px 0", borderRadius: 14,
              letterSpacing: ".03em", opacity: firing ? 0.7 : 1,
            }}>
              {firing ? "🎯 Locking on…" : payMode === "wallet" ? "🏹 FIRE SNIPE" : "🏹 I'VE SENT THE ETH"}
            </button>
            <p style={{ fontSize: 10, color: C.muted, textAlign: "center", marginTop: 10, lineHeight: 1.5 }}>
              Total-loss risk. Fee is non-refundable on transaction failure. Verify every transaction in your wallet before signing. Not investment advice.
            </p>
          </div>
        </div>
      )}

      {/* ---------- toast ---------- */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)",
          background: toast.ok ? C.green : C.red, color: "#000", fontWeight: 700, fontSize: 13,
          padding: "11px 18px", borderRadius: 99, zIndex: 60, animation: "pop .2s ease-out",
          whiteSpace: "nowrap", maxWidth: "92vw", overflow: "hidden", textOverflow: "ellipsis",
        }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}


const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<HoodSnipr />);
</script>
</body>
</html>
